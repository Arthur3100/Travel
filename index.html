<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行行程規劃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a4a;--ink2:#41506f;--paper:#f2f4f8;--card:#fff;--line:#d7dce6;--sea:#2b7a83;--sand:#d9a93a;--sky:#4d7cc9;--plum:#8a5a9c;--hero:#1b2a4a;--heroTx:#f2f4f8;--shadow:0 1px 2px rgba(27,42,74,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecf5;--ink2:#a5b0c8;--paper:#0f1626;--card:#18223a;--line:#2a3652;--hero:#18223a;--heroTx:#e8ecf5;--sea:#5bb5be;--sand:#e9c46a;--sky:#7fa6e6;--plum:#b98bcc;--shadow:none}}
:root[data-theme="dark"]{--ink:#e8ecf5;--ink2:#a5b0c8;--paper:#0f1626;--card:#18223a;--line:#2a3652;--hero:#18223a;--heroTx:#e8ecf5;--sea:#5bb5be;--sand:#e9c46a;--sky:#7fa6e6;--plum:#b98bcc;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-bottom:120px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.hero{background:var(--hero);color:var(--heroTx);margin:12px 12px 0;border-radius:22px;position:relative;overflow:hidden}
.hero input{color-scheme:dark;color:var(--heroTx);background:transparent;border:0;font:inherit}
.hero-top{padding:22px 22px 16px}
.hn{width:100%;font:900 36px/1.2 "Noto Serif TC",serif!important;border-bottom:1.5px dashed rgba(255,255,255,.3)!important;padding:0 0 4px}
.hero ::placeholder{color:var(--heroTx);opacity:.4}
.dates{margin-top:10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;opacity:.9}
.dates input{font-size:14px;padding:3px 6px;border:1px solid rgba(255,255,255,.3);border-radius:8px}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper)}
.perf::before{left:-30px}.perf::after{right:-30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 22px 18px;gap:8px}
.stats div{display:flex;flex-direction:column;min-width:0}
.stats small{font-size:12px;opacity:.65}
.stats strong,.stats input{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;padding:0}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 22px 20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sand);transition:width .4s}
.ph{display:block;width:100%;height:140px;object-fit:cover;border-radius:10px;margin:0 0 8px}
.pv{display:block;width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin:8px 0 4px}
.pv[hidden]{display:none}
.inf{display:flex;gap:8px;font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.inf>span{color:var(--ink2);flex:none;min-width:4.8em}
.inf a{color:var(--sky)}
.fx a.lk{color:var(--sky);display:inline-block;margin-top:6px}
.fx{margin:12px 12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.fx .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fx select,.fx input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.fx .eq{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.fx .eq[hidden],.fx [hidden]{display:none}
.fx .eq input{width:110px}
.home{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.stats .home{color:inherit;opacity:.65}
.tabs{display:flex;gap:8px;padding:18px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:72px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;box-shadow:var(--shadow)}
.tab small{display:block;font-size:12px;color:var(--ink2);min-height:18px}
.tab b{font-family:"Noto Serif TC",serif;font-size:17px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] small{color:var(--paper);opacity:.7}
.tab.plus{min-width:54px;text-align:center;font-size:22px;color:var(--ink2);border-style:dashed;background:none;box-shadow:none}
.dayhead{padding:14px 20px 4px}
.dayhead input{width:100%;border:0;background:transparent;color:var(--ink);font:900 22px "Noto Serif TC",serif;padding:0}
.dayhead input::placeholder{color:var(--ink2);opacity:.5}
.dayhead .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.lk{border:0;background:none;color:var(--ink2);font-size:13px;text-decoration:underline;padding:0}
.tl{list-style:none;margin:8px 0 0;padding:0 14px}
.stop{display:grid;grid-template-columns:48px 22px 1fr;column-gap:6px}
.time{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;color:var(--ink2);padding-top:14px;text-align:right}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child .rail::before{top:20px}
.stop:last-child .rail::before{bottom:calc(100% - 20px)}
.dot{position:relative;margin-top:11px;width:16px;height:16px;border-radius:50%;border:3px solid var(--c);background:var(--paper);padding:0;z-index:1}
.stop.done .dot{background:var(--c)}
.stop.done .name{text-decoration:line-through;opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:6px 0;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
a.name{color:var(--sky);text-decoration:underline;text-underline-offset:3px}
.cat{font-size:12px;color:var(--c);font-weight:700}
.note{margin:3px 0 0;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.cost{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.edit{border:0;background:none;color:var(--ink2);font-size:13px;padding:2px 0;text-decoration:underline}
.go{grid-column:3;font-size:12px;color:var(--ink2);padding:2px 0 2px 2px;display:flex;align-items:center;gap:6px}
.go::before{content:"";width:14px;border-top:1px dashed var(--ink2)}
.empty{margin:20px 14px;padding:26px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink2)}
.out{margin:26px 14px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.out h3{margin:0 0 10px;font:900 17px "Noto Serif TC",serif}
.ob{display:flex;gap:8px;flex-wrap:wrap}
.ob button{flex:1 1 auto;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:700}
.ob .pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{font-size:12px;color:var(--ink2);margin:10px 0 8px}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--sea);color:#fff;border:0;border-radius:28px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px rgba(27,42,74,.3)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h3{margin:0 0 12px;font:900 19px "Noto Serif TC",serif}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .w{grid-column:1/-1}
label{font-size:12px;color:var(--ink2);display:block;margin-bottom:3px}
.f input,.f select{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.acts{display:flex;gap:10px;margin-top:16px}
.acts button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:700}
.acts .ok{background:var(--sea);border-color:var(--sea);color:#fff;flex:2}
.acts .rm{color:#c0392b;border-color:#c0392b}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90%}
#print{display:none}
</style>
<style id="ps"></style>
<style>.tab{position:relative}.day-grip{display:block;padding:8px 18px;margin:3px -5px -3px;min-height:26px;line-height:26px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#70839a;font-size:20px;border-top:1px solid #d7dce655}.tab.swap-source{outline:2px solid #b89b57;outline-offset:-3px;opacity:.65}.tab.swap-target{outline:3px solid #2b7a83;outline-offset:-3px;background:#dff1ed!important}.swap-tools{font-size:12px;color:#617080;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0 14px}.swap-tools button{padding:5px 9px;font-size:12px}.drag-label{position:fixed;z-index:9999;pointer-events:none;background:#243e50;color:white;border-radius:10px;padding:9px 13px;font-size:13px;box-shadow:0 6px 20px #0003}.readonly #add,.readonly #dDel,.readonly .edit,.readonly [data-add],.readonly #bClr,.readonly #bHtml,.readonly #bShareEdit,.readonly #fxReset,.readonly #fxConv,.readonly #fxUndo,.readonly .sheet-bg,.readonly .day-grip,.readonly #swapTools{display:none!important}.readonly input:disabled,.readonly select:disabled{opacity:1;color:inherit;-webkit-text-fill-color:currentColor}.readonly .dot{pointer-events:none}.share-banner{padding:12px;border-radius:10px;background:#edf5f3;color:#315b60;font-size:13px;margin-bottom:12px}.share-banner.edit-copy{background:#fff5df;color:#735a22}#shareDialog{width:min(90vw,480px);box-sizing:border-box;border:1px solid #ccd5df;border-radius:18px;padding:24px;color:#263548}#shareDialog::backdrop{background:#18263888}#shareDialog textarea{width:100%;box-sizing:border-box;height:90px;margin:12px 0;font-size:12px}#shareDialog button{margin:3px}#shareMode{font-size:13px;line-height:1.7}#shareStatus{font-size:12px;color:#617080}@media print{#swapTools,#shareDialog,.drag-label,.share-banner{display:none!important}}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="旅行行程規劃"><meta name="theme-color" content="#1b2a4a"><       <div><small id="bLab">總預算</small><input id="hBudget" type="number" inputmode="numeric" min="0" placeholder="未設定" aria-label="總預算"></div>
    </div>
    <div class="bar"><i id="sBar"></i></div>
  </header>
  <section class="fx" aria-label="幣別與匯率">
    <div class="r"><div><label for="cCur">花費幣別</label><select id="cCur"></select></div><div><label for="cHome">換算成</label><select id="cHome"></select></div></div>
    <div class="eq" id="fxEq">1 <b id="fxA"></b> = <input id="cRate" type="number" step="any" min="0" inputmode="decimal" aria-label="匯率"> <b id="fxB"></b> <button class="lk" id="fxReset" hidden>恢復參考匯率</button></div>
    <p class="hint" id="fxNote"></p>
    <a class="lk" id="fxLive" target="_blank" rel="noopener noreferrer">查即時匯率 ↗</a>
    <div style="margin-top:6px;display:flex;gap:14px;flex-wrap:wrap"><button class="lk" id="fxConv"></button><button class="lk" id="fxUndo" hidden>復原換算</button></div>
  </section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="選擇日期"></nav><div id="swapTools" class="swap-tools"><span id="swapHint" role="status">按住日期上的「↔」拖到另一天，對調整天行程。</span><button id="swapCancel" hidden>取消</button><button id="swapUndo" hidden>復原上次對調</button></div>
  <div class="dayhead"><input id="dT" maxlength="30" placeholder="為這一天取個名字（選填）" aria-label="這一天的主題"><div class="sub"><span id="dSub"></span><button class="lk" id="dDel">刪除這天</button></div></div>
  <ol class="tl" id="tl"></ol>
  <section class="out">
    <h3>輸出行程</h3>
    <div class="ob"><button class="pri" id="bPdf">存成 PDF</button><button id="bHtml">下載檔案</button><button id="bShare">分享唯讀版</button><button id="bShareEdit">分享可編輯版</button><button id="bCopy">複製文字</button></div>
    <p class="hint">PDF 每天另起一頁；放不下的單站行程會整站移至下一頁。按下後，在列印視窗選「儲存為 PDF」。</p>
    <button class="lk" id="bClr">清空全部</button>
  </section>
</div>
<button class="fab" id="add">＋ 新增站點</button></div>

<div class="sheet-bg" id="bg">
  <form class="sheet" id="form" onsubmit="return false">
    <h3 id="fh">新增站點</h3>
    <div class="f">
      <div class="w"><label for="fn">名稱</label><input id="fn" placeholder="例如：清水寺" autocomplete="off"></div>
      <div><label for="ft" id="ftL">時間</label><input id="ft" type="time"></div>
      <div><label for="fc">類型</label><select id="fc"><option value="sight">景點</option><option value="food">美食</option><option value="move">交通</option><option value="stay">住宿</option><option value="flight">航班</option><option value="ride">機場接送</option></select></div>
      <div class="w"><label for="fu">超連結（地圖、官網、訂位頁）</label><input id="fu" inputmode="url" placeholder="https://" autocomplete="off"></div>
      <div class="w"><label for="fci">輸入幣別（會自動換算成頁面幣別）</label><select id="fci"></select></div>
      <div><label for="fm" id="fmL">預估花費</label><input id="fm" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><label for="fg">到下一站</label><input id="fg" placeholder="步行 10 分鐘"></div>
      <div class="w" id="fcrw" hidden><label for="fcr">匯率：1 <span id="fciA"></span> = ? <span id="fciB"></span></label><input id="fcr" type="number" step="any" min="0" inputmode="decimal"><div class="hint" id="fcp"></div><a id="fcl" target="_blank" rel="noopener noreferrer" style="color:var(--sky);font-size:13px">查即時匯率 ↗</a></div>
      <div><label for="xv" id="xvL">廠商</label><input id="xv" autocomplete="off"></div>
      <div><label for="xs">航班編號</label><input id="xs" placeholder="例如：CI 100" autocomplete="off"></div>
      <div><label for="xe">抵達時間</label><input id="xe" type="time"></div>
      <div class="w"><label for="xa" id="xaL">地址</label><input id="xa" autocomplete="off"></div>
      <div><label for="xp">電話</label><input id="xp" type="tel" inputmode="tel" autocomplete="off"></div>
      <div><label for="xk" id="xkL">訂位／訂單編號</label><input id="xk" autocomplete="off"></div>
      <div class="w"><label for="xh" id="xhL">營業時間</label><input id="xh" placeholder="例如：09:00–17:00" autocomplete="off"></div>
      <div class="w"><label for="fo">備註</label><input id="fo" placeholder="預約、營業時間⋯⋯"></div>
      <div class="w"><label for="fp">圖片（景點或飯店的照片）</label><input id="fp" type="file" accept="image/*"><img id="fpv" class="pv" alt="圖片預覽" hidden><button type="button" class="lk" id="fpx" hidden>移除圖片</button></div>
    </div>
    <div class="acts"><button type="button" class="rm" id="fdel" hidden>刪除</button><button type="button" id="cancel">取消</button><button type="button" class="ok" id="save">儲存</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="print"></div>

<script>
(async()=>{

const CATS={sight:{n:"景點",c:"var(--sea)"},food:{n:"美食",c:"var(--sand)"},move:{n:"交通",c:"var(--sky)"},stay:{n:"住宿",c:"var(--plum)"},flight:{n:"航班",c:"#d1566b"},ride:{n:"機場接送",c:"#6d9a3c"}};
const $=id=>document.getElementById(id);let KEY="trip-blank-v1";
const blank=()=>({name:"",start:"",budget:0,day:0,cur:"TWD",home:"TWD",rate:0,days:[{t:"",items:[]}]});

const READONLY=location.hash.startsWith('#view='),EDITCOPY=location.hash.startsWith('#edit=');let sharedState=null;
if(READONLY||EDITCOPY){try{
 const token=location.hash.slice(6);if(token.length>30000)throw Error();
 let bytes=Uint8Array.from(atob(token.slice(1).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 if(token[0]==='z'){
 const r=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();let chunks=[],size=0;
 while(true){const v=await r.read();if(v.done)break;size+=v.value.length;if(size>2000000){await r.cancel();throw Error()}chunks.push(v.value)}
 bytes=new Uint8Array(size);let p=0;for(const c of chunks){bytes.set(c,p);p+=c.length}
 }else if(token[0]!=='j')throw Error();
 sharedState=JSON.parse(new TextDecoder().decode(bytes));
 if(!sharedState||!Array.isArray(sharedState.days)||!sharedState.days.length||sharedState.days.length>100)throw Error();
 for(const d of sharedState.days){if(!Array.isArray(d.items)||d.items.length>500)throw Error();for(const it of d.items){delete it.img;if(!CATS[it.c])it.c='sight';if(it.u){try{if(!['https:','http:'].includes(new URL(it.u).protocol))it.u=''}catch(e){it.u=''}}}}
 sharedState.day=0;
 if(READONLY)document.documentElement.classList.add('readonly');
 if(EDITCOPY){const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));KEY='trip-edit-copy-'+Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('')}
}catch(e){document.body.textContent='分享連結無法讀取或不完整，請更新 Safari 或重新索取連結。';return}}

let S;if(READONLY){S=sharedState}else{try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S&&EDITCOPY)S=sharedState}
if(!S||!Array.isArray(S.days)||!S.days.length)S=blank();
const doSave=()=>{if(READONLY)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("儲存空間不足，部分圖片可能無法保留")}};let st;const save=()=>{clearTimeout(st);st=setTimeout(doSave,300)};addEventListener("pagehide",doSave);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 參考匯率：每 1 美元可換得的各幣別金額，2026/11/13–14 市場中間價（泰銖為 11/09） */
const USD={USD:1,TWD:32.88,JPY:159.7,KRW:1336,EUR:0.9072,GBP:0.7565,CNY:6.672,HKD:7.846,SGD:1.2882,AUD:1.4756,THB:33.55,CAD:1.4255};
const CN={TWD:["新台幣","NT$"],JPY:["日圓","¥"],KRW:["韓元","₩"],USD:["美元","US$"],EUR:["歐元","€"],GBP:["英鎊","£"],CNY:["人民幣","CN¥"],HKD:["港幣","HK$"],SGD:["新加坡幣","S$"],AUD:["澳幣","A$"],THB:["泰銖","฿"],CAD:["加幣","C$"]};
if(!CN[S.home])S.home="TWD";if(!CN[S.cur])S.cur=S.home;if(S.cur!==S.home&&!S.budget&&!S.days.some(d=>d.items.some(i=>i.m))){S.inCur=S.cur;S.cur=S.home}
const fmt=(n,c)=>Number(n).toLocaleString("en-US",{maximumFractionDigits:["JPY","KRW","TWD"].includes(c)?0:2});
const pair=()=>S.cur+">"+S.home;
const rate=()=>S.rate>0&&S.rateFor===pair()?S.rate:USD[S.home]/USD[S.cur];
const yen=n=>CN[S.cur][1]+fmt(n,S.cur);
const hm=n=>S.cur===S.home?"":CN[S.home][1]+fmt(n*rate(),S.home);
const rtxt=()=>S.cur===S.home?"":`匯率 1 ${S.cur} = ${Number(rate().toPrecision(5))} ${S.home}`;
const dayTotal=d=>d.items.reduce((a,i)=>a+(+i.m||0),0);
const sorted=d=>[...d.items].sort((a,b)=>(a.t||"99:99").localeCompare(b.t||"99:99"));
const dt=i=>{if(!S.start)return null;const d=new Date(S.start+"T00:00:00");if(isNaN(d))return null;d.setDate(d.getDate()+i);return d};
const md=i=>{const d=dt(i);return d?`${d.getMonth()+1}/${d.getDate()}`:""};
const lab=i=>{const d=dt(i);return d?`${md(i)} 週${"日一二三四五六"[d.getDay()]}`:""};
const range=()=>S.start?`${md(0)} – ${md(S.days.length-1)}，共 ${S.days.length} 天`:`共 ${S.days.length} 天`;
const total=()=>S.days.reduce((a,d)=>a+d.items.reduce((b,i)=>b+(+i.m||0),0),0);
let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",2600)};

/* 輸出用版面 */
const PC=`body{font:10pt/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#263548;margin:0;background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#print{width:auto!important;height:auto!important;overflow:visible!important;margin:0;padding:0}h1{font:900 26pt/1.35 "Noto Serif TC",serif;color:#243e50;margin:0 0 10pt;padding:12pt 0;border-top:3pt solid #243e50;border-bottom:1pt solid #b8a16a;overflow-wrap:anywhere;break-after:avoid;page-break-after:avoid}h1:before{content:"TRAVEL JOURNAL / 旅行手帖";display:block;font:8pt sans-serif;letter-spacing:2pt;color:#897750;margin-bottom:9pt}.meta{font-size:8.5pt;color:#637080;background:#f4f3ef;padding:9pt 11pt;margin:0 0 15pt;border-left:2pt solid #b8a16a;break-inside:avoid;page-break-inside:avoid;break-after:avoid;page-break-after:avoid}.day{display:block;position:static;height:auto!important;overflow:visible!important;transform:none!important;margin:0;padding:0;break-inside:auto}.day+.day{break-before:page;page-break-before:always}h2{font-size:13pt;color:#243e50;border-bottom:1pt solid #b8a16a;padding:6pt 0;margin:0 0 8pt;break-after:avoid;page-break-after:avoid;break-inside:avoid}.it{display:block!important;position:relative;box-sizing:border-box;padding:10pt 0 10pt 56pt;margin:0;border-bottom:.5pt solid #dedfdc;overflow:visible!important;break-inside:avoid!important;break-inside:avoid-page!important;page-break-inside:avoid!important}.t{position:absolute;top:10pt;left:0;width:43pt;border-right:1pt solid #d5c7aa;font:700 10pt/1.8 sans-serif;color:#8a7446;box-sizing:border-box;padding-right:8pt}.b{display:block;min-width:0;overflow:visible;overflow-wrap:anywhere}.b>b{font-size:11pt;color:#243e50}.k{display:inline-block;font-size:8pt;color:#486b70;margin-left:6pt;padding:0 4pt;border:.5pt solid #c7d4d1;border-radius:3pt}.m{display:inline-block;margin-left:9pt;font-size:9pt;color:#8a7446;font-weight:700}.u{font-size:7.5pt;color:#7a8590;overflow-wrap:anywhere;margin-top:3pt}.g{font-size:9pt;color:#61717b;margin-top:3pt}a{color:#325e72;text-decoration:none;overflow-wrap:anywhere}.ph{display:block;width:auto!important;height:auto!important;max-width:100%!important;max-height:65mm!important;object-fit:contain;border-radius:4pt;margin:0 0 7pt;break-inside:avoid;page-break-inside:avoid}p{orphans:3;widows:3}@page{size:A4;margin:17mm 16mm 18mm}`;
$("ps").textContent=`@media print{:root{padding:0!important}.app,.sheet-bg,.toast{display:none!important}#print{display:block}${PC}}`;
function pm(){
  let h=`<h1>${esc(S.name||"我的旅行")}</h1><p class="meta">${esc(range())}　預算 ${S.budget?yen(S.budget):"未設定"}　預估花費 ${yen(total())}${hm(total())?"（≈ "+hm(total())+"）":""}${rtxt()?"　"+rtxt():""}</p>`;
  S.days.forEach((d,i)=>{
    h+=`<section class="day"><h2>第 ${i+1} 天${lab(i)?"　"+lab(i):""}${d.t?"　"+esc(d.t):""}</h2>`;
    h+=d.items.length?sorted(d).map(it=>`<div class="it"><div class="t">${esc(it.t)}</div><div class="b">${it.img?`<img class="ph" src="${it.img}" alt="${esc(it.n)}">`:""}<b>${it.u?`<a href="${esc(it.u)}">${esc(it.n)}</a>`:esc(it.n)}</b><span class="k">${CATS[it.c].n}</span>${it.m?`<span class="m">${yen(it.m)}${hm(it.m)?" ≈ "+hm(it.m):""}</span>`:""}${rows(it).map(r=>`<div class="g">${r[0]}：${rowHtml(r)}</div>`).join("")}${it.o?`<div>${esc(it.o)}</div>`:""}${it.u?`<div class="u">${esc(it.u)}</div>`:""}${it.g?`<div class="g">→ ${esc(it.g)}</div>`:""}</div></div>`).join(""):`<p class="meta">尚未安排</p>`;
    h+="</section>"});
  return h}
function plain(){
  let s=`${S.name||"我的旅行"}\n${range()}\n`;
  S.days.forEach((d,i)=>{s+=`\n第 ${i+1} 天 ${lab(i)} ${d.t}`.trimEnd()+"\n";
    sorted(d).forEach(it=>{s+=`${it.t||"--:--"} ${it.n}（${CATS[it.c].n}）${it.m?" "+yen(it.m)+(hm(it.m)?" ≈ "+hm(it.m):""):""}\n`;rows(it).forEach(r=>{s+=`  ${r[0]}：${r[1]}\n`});if(it.u)s+=`  ${it.u}\n`;if(it.o)s+=`  ${it.o}\n`;if(it.g)s+=`  → ${it.g}\n`})});
  if(rtxt())s+=`\n${rtxt()}\n`;
  return s}

const mapUrl=a=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);
const rows=it=>{const c=it.c,R=[],A=(l,v,k)=>{if(v)R.push([l,v,k])};
  if(c==="flight"){A("航班",[it.v,it.s].filter(Boolean).join(" "));A("航線",it.a);A("抵達時間",it.e);A("訂位代號",it.k)}
  else if(c==="ride"){A("接送廠商",it.v);A("電話",it.p,"tel");A("接送地點",it.a,"map");A("訂單編號",it.k)}
  else{A("地址",it.a,"map");A("電話",it.p,"tel");A(c==="stay"?"入住／退房":"營業時間",it.h);A("訂位／訂單",it.k)}
  return R};
const rowHtml=r=>r[2]==="map"?`<a href="${esc(mapUrl(r[1]))}" target="_blank" rel="noopener noreferrer">${esc(r[1])}</a>`:r[2]==="tel"?`<a href="tel:${esc(r[1].replace(/[^\d+]/g,""))}">${esc(r[1])}</a>`:esc(r[1]);
function render(){
  const all=S.days.flatMap(d=>d.items),spent=total();
  $("sCount").textContent=all.length;$("sSpent").textContent=yen(spent);$("sHome").textContent=hm(spent)?"≈ "+hm(spent):"";$("bLab").textContent="總預算（"+S.cur+"）";fxUI();
  const b=$("sBar");b.style.width=(S.budget>0?Math.min(100,spent/S.budget*100):0)+"%";b.style.background=S.budget>0&&spent>S.budget?"#e76f51":"var(--sand)";
  $("hRange").textContent=range();
  $("tabs").innerHTML=S.days.map((d,i)=>`<button class="tab" role="tab" aria-selected="${i===S.day}" data-i="${i}"><small>${esc(lab(i))}</small><b>第 ${i+1} 天</b><span class="day-grip" role="button" tabindex="0" aria-label="對調第 ${i+1} 天行程" data-grip="${i}">↔</span></button>`).join("")+`<button class="tab plus" data-add aria-label="新增一天">＋</button>`;
  const day=S.days[S.day];
  if(document.activeElement!==$("dT"))$("dT").value=day.t;
  $("dSub").textContent=`${day.items.length} 站　當日 ${yen(dayTotal(day))}${hm(dayTotal(day))?" ≈ "+hm(dayTotal(day)):""}`;
  $("dDel").hidden=S.days.length<2;
  $("tl").innerHTML=day.items.length?sorted(day).map(it=>{
    const c=CATS[it.c]||CATS.sight;
    return `<li class="stop ${it.x?"done":""}" style="--c:${c.c}">
      <div class="time">${esc(it.t)}</div>
      <div class="rail"><button class="dot" data-done="${it.id}" aria-label="標記完成：${esc(it.n)}" aria-pressed="${!!it.x}"></button></div>
      <div class="card">${it.img?`<img class="ph" src="${it.img}" alt="${esc(it.n)}">`:""}<div class="row"><div>${it.u?`<a class="name" href="${esc(it.u)}" target="_blank" rel="noopener noreferrer">${esc(it.n)} ↗</a>`:`<div class="name">${esc(it.n)}</div>`}<span class="cat">${c.n}</span></div>
        <div><div class="cost">${it.m?yen(it.m):"—"}${it.m&&hm(it.m)?`<span class="home">≈ ${hm(it.m)}</span>`:""}</div><button class="edit" data-edit="${it.id}">編輯</button></div></div>
        ${rows(it).map(r=>`<div class="inf"><span>${r[0]}</span><div>${rowHtml(r)}</div></div>`).join("")}${it.o?`<p class="note">${esc(it.o)}</p>`:""}</div>
      ${it.g?`<div class="go">${esc(it.g)}</div>`:""}</li>`}).join("")
    :`<li class="empty">這一天還沒有安排。<br>點右下角「新增站點」開始規劃。</li>`;
  $("print").innerHTML=pm();save()}

/* 事件 */
$("hName").value=S.name;$("hStart").value=S.start;$("hBudget").value=S.budget||"";
$("hName").oninput=e=>{S.name=e.target.value;render()};
$("hStart").onchange=e=>{S.start=e.target.value;render()};
$("hBudget").oninput=e=>{S.budget=+e.target.value||0;render()};
$("dT").oninput=e=>{S.days[S.day].t=e.target.value;$("print").innerHTML=pm();save()};
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;
  if(b.hasAttribute("data-add")){S.days.push({t:"",items:[]});S.day=S.days.length-1}else S.day=+b.dataset.i;render()};
$("dDel").onclick=()=>{const d=S.days[S.day];
  if(d.items.length&&$("dDel").dataset.arm!=="1"){$("dDel").dataset.arm="1";$("dDel").textContent="再按一次確認刪除";setTimeout(()=>{$("dDel").dataset.arm="";$("dDel").textContent="刪除這天"},3000);return}
  $("dDel").dataset.arm="";$("dDel").textContent="刪除這天";S.days.splice(S.day,1);S.day=Math.max(0,S.day-1);render()};

let E=null;
const open=v=>$("bg").classList.toggle("open",v);
function openForm(id){
  E=id;const it=id?S.days[S.day].items.find(x=>x.id===id):null;
  $("fh").textContent=it?"編輯站點":"新增站點";$("fdel").hidden=!it;
  $("fn").value=it?it.n:"";$("ft").value=it?it.t:"";$("fc").value=it?it.c:"sight";
  $("fu").value=it?it.u||"":"";$("fm").value=it&&it.m?it.m:"";$("fg").value=it?it.g||"":"";$("fo").value=it?it.o||"":"";
  $("fmL").textContent="預估花費（"+S.cur+"）";["xv","xs","xe","xa","xp","xk","xh"].forEach(k=>{$(k).value=it&&it[k.slice(1)]?it[k.slice(1)]:""});xUI();$("fci").value=it?S.cur:(CN[S.inCur]?S.inCur:S.cur);ciUI();PH=it?it.img||"":"";phUI();open(true);$("fn").focus()}
$("add").onclick=()=>openForm(null);
$("tl").onclick=e=>{const day=S.days[S.day],d=e.target.closest("[data-done]"),x=e.target.closest("[data-edit]");
  if(d){const it=day.items.find(i=>i.id===d.dataset.done);it.x=!it.x;render()}else if(x)openForm(x.dataset.edit)};
$("cancel").onclick=()=>open(false);

const dialog=document.createElement('dialog');dialog.id='shareDialog';dialog.innerHTML='<h3 id="shareTitle"></h3><p id="shareMode"></p><p>連結包含你目前已排好的文字行程、日期、費用、備註及連結，不含照片。持有連結的人可讀取其中的訂位與聯絡資訊，請確認適合分享。</p><textarea readonly aria-label="分享連結"></textarea><p><button id="shareSend">傳送連結</button><button id="shareCopy">複製連結</button><button id="shareClose">關閉</button></p><p id="shareStatus" role="status"></p>';document.body.appendChild(dialog);

$('shareClose').onclick=()=>dialog.close();

async function shareTrip(edit){
 if(READONLY&&edit)return;
 if(!/^https?:$/.test(location.protocol)){alert('請先上傳 GitHub Pages，再從網站分享行程。');return}
 const b=$(edit?'bShareEdit':'bShare');b.disabled=true;
 try{
 doSave();const snap=JSON.parse(JSON.stringify(S));snap.day=0;for(const d of snap.days)for(const it of d.items)delete it.img;
 let bytes=new TextEncoder().encode(JSON.stringify(snap)),mode='j';
 if(window.CompressionStream){bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());mode='z'}
 let bin='';for(const n of bytes)bin+=String.fromCharCode(n);
 readyLink=location.href.split('#')[0]+(edit?'#edit=':'#view=')+mode+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 if(readyLink.length>24000){alert('行程內容過長，請減少備註或拆分行程後再分享。');return}
 sharingEdit=edit;$('shareTitle').textContent=edit?'分享已排好的行程・可編輯版':'分享已排好的行程・唯讀版';
 $('shareMode').textContent=edit?'旅伴將直接看到你的完整文字行程，並可修改自己的獨立副本。不會改到你的原稿，也不會多人同步。':'旅伴將直接看到你的完整文字行程，可切換天數、點地圖及存成 PDF，不能在介面編輯。';
 dialog.querySelector('textarea').value=readyLink;$('shareStatus').textContent='這是目前行程的快照；之後修改需重新分享。';dialog.showModal();
 }catch(e){alert('產生連結失敗，請重試。')}finally{b.disabled=false}
}
$('bShare').onclick=()=>shareTrip(false);$('bShareEdit').onclick=()=>shareTrip(true);
let swapSource=null,undoSwap=null,drag=null,suppressUntil=0;
const tabAt=i=>$('tabs').querySelector('.tab[data-i="'+i+'"]');
function clearMarks(){document.querySelectorAll('.swap-source,.swap-target').forEach(t=>t.classList.remove('swap-source','swap-target'))}
function cancelSwap(){swapSource=null;clearMarks();$('swapCancel').hidden=true;$('swapHint').textContent='按住日期上的「↔」拖到另一天，對調整天行程。'}
function exchangeDays(a,b){
 if(READONLY||a===b||!S.days[a]||!S.days[b]){cancelSwap();return}
 undoSwap={first:S.days[a],second:S.days[b]};const la=lab(a)||'第 '+(a+1)+' 天',lb=lab(b)||'第 '+(b+1)+' 天';
 [S.days[a],S.days[b]]=[S.days[b],S.days[a]];if(S.day===a)S.day=b;else if(S.day===b)S.day=a;
 cancelSwap();render();doSave();$('swapUndo').hidden=false;$('swapHint').textContent='已對調 '+la+' 與 '+lb+' 的整天行程，日期不變。';toast('整天行程已對調');
}
$('swapCancel').onclick=cancelSwap;
$('swapUndo').onclick=()=>{if(READONLY||!undoSwap)return;const a=S.days.indexOf(undoSwap.first),b=S.days.indexOf(undoSwap.second);if(a<0||b<0){undoSwap=null;$('swapUndo').hidden=true;toast('日期已刪除，無法復原');return}[S.days[a],S.days[b]]=[S.days[b],S.days[a]];if(S.day===a)S.day=b;else if(S.day===b)S.day=a;undoSwap=null;cancelSwap();render();doSave();$('swapUndo').hidden=true;toast('已復原上次對調')};
function selectSwap(i){cancelSwap();swapSource=i;tabAt(i)?.classList.add('swap-source');$('swapCancel').hidden=false;$('swapHint').textContent='已選取 '+(lab(i)||'第 '+(i+1)+' 天')+'，請點另一個日期以對調。'}
$('tabs').addEventListener('click',e=>{if(READONLY)return;const g=e.target.closest('[data-grip]'),t=e.target.closest('.tab[data-i]');if(Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();return}if(g){e.preventDefault();e.stopImmediatePropagation();const i=+g.dataset.grip;if(swapSource!==null)exchangeDays(swapSource,i);else selectSwap(i);return}if(swapSource!==null&&t){e.preventDefault();e.stopImmediatePropagation();exchangeDays(swapSource,+t.dataset.i)}},true);
$('tabs').addEventListener('keydown',e=>{const g=e.target.closest('[data-grip]');if(!g||READONLY)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopImmediatePropagation();const i=+g.dataset.grip;if(swapSource===null)selectSwap(i);else exchangeDays(swapSource,i)}if(e.key==='Escape')cancelSwap()},true);
$('tabs').addEventListener('contextmenu',e=>{if(e.target.closest('[data-grip]'))e.preventDefault()});
function targetAt(x,y){const t=document.elementFromPoint(x,y)?.closest('#tabs .tab[data-i]');return t?+t.dataset.i:null}
function updateDrag(){if(!drag)return;const d=drag,r=$('tabs').getBoundingClientRect();if(d.active){if(d.x<r.left+32)$('tabs').scrollLeft-=7;else if(d.x>r.right-32)$('tabs').scrollLeft+=7;clearMarks();tabAt(d.from)?.classList.add('swap-source');const i=targetAt(d.x,d.y);if(i!==null&&i!==d.from)tabAt(i)?.classList.add('swap-target');d.label.style.left=Math.max(5,Math.min(innerWidth-180,d.x-60))+'px';d.label.style.top=Math.max(5,d.y-58)+'px'}d.raf=requestAnimationFrame(updateDrag)}
$('tabs').addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g||READONLY||e.button!==0||drag)return;cancelSwap();g.setPointerCapture(e.pointerId);const label=document.createElement('div');label.className='drag-label';label.textContent='拖到另一天後放開，即可對調';label.hidden=true;document.body.appendChild(label);drag={id:e.pointerId,from:+g.dataset.grip,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,active:false,label};drag.timer=setTimeout(()=>{if(drag){drag.active=true;drag.label.hidden=false}},250);updateDrag()});
$('tabs').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>7){drag.active=true;drag.label.hidden=false}if(drag.active)e.preventDefault()});
function endDrag(e,cancelled){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;clearTimeout(d.timer);cancelAnimationFrame(d.raf);d.label.remove();clearMarks();if(d.active){suppressUntil=Date.now()+600;if(!cancelled){const i=targetAt(e.clientX,e.clientY);if(i!==null&&i!==d.from)exchangeDays(d.from,i);else cancelSwap()}}}
$('tabs').addEventListener('pointerup',e=>endDrag(e,false));$('tabs').addEventListener('pointercancel',e=>endDrag(e,true));
if(READONLY||EDITCOPY){const b=document.createElement('div');b.className='share-banner'+(EDITCOPY?' edit-copy':'');b.textContent=EDITCOPY?'可編輯副本｜已載入分享者排好的文字行程。修改儲存在目前瀏覽器，不影響原稿；要傳回修改，請重新分享。':'分享行程・唯讀模式｜已載入分享者排好的文字行程，可切換天數、開啟連結及輸出 PDF，不能編輯。';document.querySelector('.wrap').prepend(b)}
